<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Planejador Acadêmico</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}"/>
</head>
<body data-curso-id="{{ curso_id }}">
<div id="app">
  <!-- SIDEBAR -->
  <aside id="sidebar">
    <div class="logo">
      <h1>📚 Planner<br>Acadêmico</h1>
      <span>Planejamento inteligente</span>
      <div class="curso-ativo">
        <div id="curso-ativo-nome">Carregando…</div>
        <a href="/">⇄ Trocar de curso</a>
      </div>
    </div>
    <nav>
      <div class="nav-section">Principal</div>
      <div class="nav-item" data-page="dashboard" onclick="navTo('dashboard',this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        <span>Dashboard</span>
      </div>
      <div class="nav-item" data-page="planner" onclick="navTo('planner',this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
        <span>Planejamento</span>
      </div>
      <div class="nav-item active" data-page="fluxograma" onclick="navTo('fluxograma',this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        <span>Fluxograma</span>
      </div>
      <div class="nav-item" data-page="calendario" onclick="navTo('calendario',this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span>Calendário</span>
      </div>
      <div class="nav-section">Dados</div>
      <div class="nav-item" data-page="historico" onclick="navTo('historico',this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/><path d="M12 6v6l4 2"/></svg>
        <span>Histórico</span>
      </div>
      <div class="nav-item" data-page="disciplinas" onclick="navTo('disciplinas',this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        <span>Disciplinas</span>
      </div>
    </nav>
  </aside>

  <!-- MAIN -->
  <div id="main">
    <div id="topbar">
      <h2 id="page-title">Fluxograma Curricular</h2>
      <div id="topbar-actions"></div>
    </div>
    <div id="content"></div>
  </div>
</div>

<!-- TOAST AREA -->
<div id="toast-area"></div>

<!-- MODAL -->
<div id="modal-overlay" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-box"></div>
</div>

<!-- Scripts clássicos, na ordem: compartilham o escopo global (os onclick do HTML dependem disso). -->
<script src="{{ url_for('static', filename='js/core.js') }}"></script>
<script src="{{ url_for('static', filename='js/plano_store.js') }}"></script>
<script src="{{ url_for('static', filename='js/page_dashboard.js') }}"></script>
<script src="{{ url_for('static', filename='js/page_planner.js') }}"></script>
<script src="{{ url_for('static', filename='js/page_fluxograma.js') }}"></script>
<script src="{{ url_for('static', filename='js/horarios_proprios.js') }}"></script>
<script src="{{ url_for('static', filename='js/page_calendario.js') }}"></script>
<script src="{{ url_for('static', filename='js/page_historico.js') }}"></script>
<script src="{{ url_for('static', filename='js/page_disciplinas.js') }}"></script>
<script src="{{ url_for('static', filename='js/disc_detalhe.js') }}"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
