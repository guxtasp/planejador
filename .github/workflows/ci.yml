name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Migrações aplicam e não divergem dos modelos
        run: |
          export APP_ENV=development DATABASE_URL=sqlite:///ci.db
          flask --app planner db upgrade
          flask --app planner db check
